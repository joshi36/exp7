<!DOCTYPE html>
<html>
<head>
<title>Analytics Demo</title>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-Q7SE0V17XV"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-Q7SE0V17XV');
</script>

</head>
<body>

<h1>Welcome to the Demo Website</h1>
<p>This page is used for Google Analytics tracking.</p>

<button onclick="trackClick()">Click Me</button>

<script>
function trackClick() {
  alert("Button clicked");

  // Track button click event
  gtag('event', 'button_click', {
    'event_category': 'engagement',
    'event_label': 'Click Me Button'
  });
}
</script>

</body>
</html>
